name: PR20 check existing Worker deployment access

on:
  push:
    branches: [ops/release-pr20-20260920]
    paths: [.github/workflows/approved-pr20-worker-access.yml]

permissions:
  contents: read

jobs:
  access:
    if: github.repository == 'Emelkey/Max-saite'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify only already-configured Cloudflare deployment access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = { checkedAt: new Date().toISOString(), targetWorker: 'max-site-leads', tokenConfigured: Boolean(process.env.CF_TOKEN), accountConfigured: Boolean(process.env.CF_ACCOUNT), status: 'AUTH_UNAVAILABLE', changesMade: false };
          (async () => {
            try {
              if (process.env.CF_TOKEN && process.env.CF_ACCOUNT) {
                const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CF_ACCOUNT)}/workers/scripts/max-site-leads/settings`;
                const r = await fetch(url, { headers: { Authorization: `Bearer ${process.env.CF_TOKEN}` }, signal: AbortSignal.timeout(15000) });
                const body = await r.json().catch(() => null);
                report.httpStatus = r.status;
                report.status = r.ok && body?.success === true ? 'SETTINGS_READ_AVAILABLE' : 'AUTH_OR_RESOURCE_REJECTED';
                report.hasDurableDeliveryBinding = Boolean(body?.result?.bindings?.some(x => x.name === 'LEAD_DELIVERY_GATE'));
                report.hasTelegramSecretBinding = Boolean(body?.result?.bindings?.some(x => x.name === 'TELEGRAM_BOT_TOKEN' && x.type === 'secret_text'));
              }
            } catch (error) { report.status = 'ACCESS_CHECK_FAILED'; report.error = error.name; }
            fs.writeFileSync('/tmp/pr20-worker-access.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr20-worker-access
          path: /tmp/pr20-worker-access.json
          retention-days: 7
          if-no-files-found: error
