name: MAX SITE bounded read-only live verification
on:
  workflow_dispatch:
  push:
    branches: [qa/read-only-live-recovery-ce088208]
    paths: [.github/workflows/live-smoke-recovery.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce088208b4315b153d8bc892a81cd24cdd98ca71
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact approved source tree
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          (async()=>{
            const expected='81bf1e6022b8142be5769ef947e7af89cdc67eae';
            const response=await fetch('https://api.github.com/repos/Emelkey/Max-saite/git/trees/'+expected+'?recursive=1',{headers:{Accept:'application/vnd.github+json'}});
            assert.equal(response.status,200,'Immutable public tree manifest must be available');
            const manifest=await response.json();assert.equal(manifest.sha,expected);assert.equal(manifest.truncated,false);
            const entries=manifest.tree.filter(e=>e.type!=='tree');assert.ok(entries.length>800);
            const expectedPaths=new Set();
            for(const e of entries){
              assert.equal(e.type,'blob','No unverified submodules');
              assert.ok(!path.isAbsolute(e.path)&&!e.path.split('/').includes('..')&&!e.path.startsWith('.git/'));
              expectedPaths.add(e.path);const st=fs.lstatSync(e.path);
              let body;
              if(e.mode==='120000'){assert.ok(st.isSymbolicLink());body=Buffer.from(fs.readlinkSync(e.path));}
              else {assert.ok(st.isFile());assert.equal((st.mode&0o111)!==0,e.mode==='100755',e.path+' executable mode');body=fs.readFileSync(e.path);}
              const hash=crypto.createHash('sha1').update(Buffer.from('blob '+body.length+'\0')).update(body).digest('hex');
              assert.equal(hash,e.sha,e.path+' immutable blob hash');
            }
            const walk=d=>{for(const n of fs.readdirSync(d)){const p=path.posix.join(d,n);if(p==='.git')continue;const st=fs.lstatSync(p);if(st.isDirectory())walk(p);else assert.ok(expectedPaths.has(p),'Unexpected checkout path '+p);}};
            walk('.');console.log('Exact immutable source tree verified:',expected,entries.length,'paths, blob contents and modes');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - run: npm ci
      - name: Verify matching preinstalled browsers
        run: |
          node -e 'const fs=require("fs"),a=require("assert/strict"),p=require("@playwright/test");a.equal(require("@playwright/test/package.json").version,"1.62.1");for(const b of [p.chromium,p.webkit])fs.accessSync(b.executablePath(),fs.constants.X_OK)'
      - name: Verify exact public revision before tests
        run: node tools/verify-production-release.js --base-url https://maxsite.com.ua --expected-revision ce088208b4315b153d8bc892a81cd24cdd98ca71 --attempts 1
      - name: All unchanged read-only desktop and mobile assertions
        env:
          EXPECTED_RELEASE_REVISION: ce088208b4315b153d8bc892a81cd24cdd98ca71
        run: npx playwright test --config=playwright.live.config.js
      - name: Verify public revision stayed unchanged
        run: node tools/verify-production-release.js --base-url https://maxsite.com.ua --expected-revision ce088208b4315b153d8bc892a81cd24cdd98ca71 --attempts 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxsite-read-only-live-recovery
          path: |
            artifacts/seo/production-release-smoke.json
            artifacts/playwright/live-results
            artifacts/playwright/live-report
