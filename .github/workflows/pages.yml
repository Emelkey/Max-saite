name: Deploy MAX SITE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Audit source SEO and internal links
        run: node tools/audit-site.js

      - name: Build production site
        run: >-
          node tools/build-hosting-package.js
          --site-url https://maxsite.com.ua
          --form-endpoint https://max-site-leads.emelkey777.workers.dev
          --ga4 "${{ vars.GA4_ID }}"
          --search-console-token "${{ vars.SEARCH_CONSOLE_TOKEN }}"

      - name: Audit production package
        run: >-
          node tools/audit-site.js
          --root release/max-site-production
          --site-url https://maxsite.com.ua

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/max-site-production

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Triggered after repository visibility changed to public.
