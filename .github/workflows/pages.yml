name: Deploy MAX SITE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Run full SEO, unit and build gate
        run: npm run seo:check

      - name: Run desktop and mobile browser QA
        run: npm run test:browser

      - name: Run Lighthouse mobile budgets
        run: npm run lighthouse

      - name: Audit production package
        run: >-
          node tools/audit-site.js
          --root release/max-site-production
          --site-url https://maxsite.com.ua

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-qa-artifacts
          path: |
            artifacts/seo
            artifacts/playwright
            artifacts/lighthouse

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/max-site-production

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Triggered after repository visibility changed to public.
